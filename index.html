<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Sitio de Prueba</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#0f172a;
            color:white;
            text-align:center;
            padding-top:100px;
        }

        button{
            background:#22c55e;
            border:none;
            padding:15px 25px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        #mensaje{
            margin-top:20px;
            font-size:20px;
        }
    </style>
</head>
<body>

    <h1>🚀 Mi primera página en GitHub Pages</h1>

    <p>Publicada por Daniel usando GitHub.</p>

    <button onclick="saludar()">
        Haz clic aquí
    </button>

    <div id="mensaje"></div>

    <script>
        function saludar() {
            document.getElementById("mensaje").innerHTML =
                "✅ Funciona correctamente";
        }
    </script>

</body>
</html>
