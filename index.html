<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            text-align: center;
        }

        header {
            background: #0078d4;
            color: white;
            padding: 30px;
        }

        .contenido {
            margin: 50px auto;
            max-width: 900px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #005ea6;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #222;
            color: white;
        }

        #imagen1 {
            display: none;
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 Bienvenido a mi página web</h1>
        <p>Creada con HTML, CSS y JavaScript</p>
    </header>

    <div class="contenido">
        <h2>Hola Putinga</h2>

        <p>
            Esta es una página web simple funcionando desde GitHub Pages.
        </p>

        <button onclick="saludar()">
            Haz clic aquí
        </button>

        <p id="mensaje"></p>

        <img
            id="imagen1"
            src="https://dannyas7.github.io/WB/1.jpg"
            alt="Imagen de prueba">
    </div>

    <footer>
        © 2026 - Página de prueba
    </footer>

    <script>
        function saludar() {

            document.getElementById("mensaje").innerHTML =
                "✅ El botón funciona y la imagen debería aparecer abajo.";

            document.getElementById("imagen1").style.display = "block";
        }
    </script>

</body>
</html>
